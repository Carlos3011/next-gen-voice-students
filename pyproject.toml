[project]
name = "adk-taller"
version = "0.1.0"
description = "Taller de 3hrs — Desarrollo de Agentes con Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer==3.3.2",
    "google-adk",
]

[tool.uv]
python-preference = "managed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
